<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart - SAVERY</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <!-- CSS -->
    <link rel="stylesheet" href="style2.css" />
  </head>

  <body>
    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <img src="img/logo_SAVERY.png" width="60px" class="me-3" />
        <a class="navbar-brand fw-bold" href="#">SAV<span>ERY</span> </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <div class="navbar-extra">
            <a href="cart.html" id="cart"><i class="bi bi-cart"></i></a>
          </div>
        </div>
      </div>
    </nav>
    <!-- Navbar End -->

    <!-- Cart Section -->
    <section class="cart-section">
      <div class="container">
        <h1 class="text-center mb-5"><span class="text-warning">Shopping</span> Cart</h1>

        <div class="mb-4">
          <a href="index.html #menu" class="btn btn-outline-warning">
            <i class="bi bi-arrow-left"></i>
            Kembali ke Menu
          </a>
        </div>

        <div id="cartContainer"></div>

        <!-- Total -->
        <div class="total-box mt-4">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h4>Total Item</h4>
            <h4 id="totalItem" class="text-warning">0</h4>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <h4>Total Harga</h4>
            <h4 id="totalPrice" class="text-warning">Rp0</h4>
          </div>

          <button class="btn btn-warning w-100 mt-4 fw-bold" id="checkoutBtn">Checkout</button>
        </div>
      </div>
    </section>

    <div class="checkout-popup" id="checkout-popup">
      <div class="popup-box">
        <i class="bi bi-cart-check-fill popup-icon"></i>

        <h3>Konfirmasi Checkout</h3>

        <p>Apakah Anda yakin ingin checkout pesanan ini?</p>

        <div class="popup-btn">
          <button class="btn-cancel" id="cancelCheckout">Batal</button>

          <button class="btn-confirm" id="confirmCheckout">Ya, Checkout</button>
        </div>
      </div>
    </div>

    <script>
      const cartContainer = document.getElementById("cartContainer");

      const totalItem = document.getElementById("totalItem");

      const totalPrice = document.getElementById("totalPrice");

      const checkoutBtn = document.getElementById("checkoutBtn");

      // POPUP
      const checkoutPopup = document.getElementById("checkout-popup");

      const cancelCheckout = document.getElementById("cancelCheckout");

      const confirmCheckout = document.getElementById("confirmCheckout");

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      function renderCart() {
        cartContainer.innerHTML = "";

        if (cart.length === 0) {
          cartContainer.innerHTML = `
            <div class="empty-cart">

              <i class="bi bi-cart-x fs-1 text-warning"></i>

              <h3 class="mt-3">
                Keranjang masih kosong
              </h3>

            </div>
          `;

          totalItem.innerText = 0;

          totalPrice.innerText = "Rp0";

          return;
        }

        let total = 0;

        let totalHarga = 0;

        cart.forEach((item, index) => {
          total += item.qty;

          totalHarga += item.price * item.qty;

          cartContainer.innerHTML += `
            <div class="cart-card">

              <div class="d-flex justify-content-between align-items-center">

                <div>

                  <h4>${item.name}</h4>

                  <p class="mb-1">
                    Quantity :
                    <span class="price">
                      ${item.qty}
                    </span>
                  </p>

                  <p class="mb-0 text-warning fw-bold">
                    Rp${(item.price * item.qty).toLocaleString("id-ID")}
                  </p>

                </div>

                <div class="qty-wrapper">

  <button
    class="qty-btn"
    onclick="decreaseQty(${index})"
  >
    <i class="bi bi-dash-lg"></i>
  </button>

  <span class="qty-number">
    ${item.qty}
  </span>

  <button
    class="qty-btn"
    onclick="increaseQty(${index})"
  >
    <i class="bi bi-plus-lg"></i>
  </button>

</div>

              </div>

            </div>
          `;
        });

        totalItem.innerText = total;

        totalPrice.innerText = "Rp" + totalHarga.toLocaleString("id-ID");
      }

      function increaseQty(index) {
        cart[index].qty++;

        localStorage.setItem("cart", JSON.stringify(cart));

        renderCart();
      }

      function decreaseQty(index) {
        cart[index].qty--;

        if (cart[index].qty <= 0) {
          cart.splice(index, 1);
        }

        localStorage.setItem("cart", JSON.stringify(cart));

        renderCart();
      }

      // =========================
      // CHECKOUT BUTTON
      // =========================

      checkoutBtn.addEventListener("click", function () {
        // Jika cart kosong
        if (cart.length === 0) {
          alert("Keranjang masih kosong!");
          return;
        }

        // Munculkan popup
        checkoutPopup.classList.add("active");
      });

      // =========================
      // CANCEL BUTTON
      // =========================

      cancelCheckout.addEventListener("click", function () {
        checkoutPopup.classList.remove("active");
      });

      // =========================
      // CONFIRM BUTTON
      // =========================

      confirmCheckout.addEventListener("click", function () {
        window.location.href = "payment.html";
      });

      renderCart();
    </script>
  </body>
</html>
