<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment - SAVERY</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <!-- CSS -->
    <link rel="stylesheet" href="stylePayment.css" />
  </head>

  <body>
    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <img src="img/logo_SAVERY.png" width="60px" class="me-3" />
        <a class="navbar-brand fw-bold me-auto" href="index.html">SAV<span>ERY</span> </a>
        <div class="navbar-extra">
          <a href="cart.html" id="cart"><i class="bi bi-cart"></i></a>
          <a href="index.html" id="home"><i class="bi bi-house-door-fill"></i></a>
        </div>
      </div>
    </nav>
    <!-- Navbar End -->

    <!-- Payment Section -->
    <section class="payment-section">
      <div class="container">
        <h1 class="text-center mb-5 payment-title"><span>Payment</span> Method</h1>

        <div class="row justify-content-center">
          <div class="col-lg-7">
            <div class="payment-card">
              <!-- Back -->
              <div class="mb-4">
                <a href="cart.html" class="btn btn-outline-warning">
                  <i class="bi bi-arrow-left"></i>
                  Kembali ke Cart
                </a>
              </div>

              <!-- Form -->
              <form id="paymentForm">
                <!-- Nama -->
                <div class="mb-4">
                  <label class="form-label"> Nama Lengkap </label>

                  <input type="text" class="form-control" placeholder="Masukkan nama lengkap" required />
                </div>

                <!-- Nomor HP -->
                <div class="mb-4">
                  <label class="form-label"> Nomor HP </label>

                  <input type="text" class="form-control" placeholder="Masukkan nomor HP" required />
                </div>

                <!-- Alamat -->
                <div class="mb-4">
                  <label class="form-label"> Alamat Pengiriman </label>

                  <textarea class="form-control" rows="4" placeholder="Masukkan alamat lengkap" required></textarea>
                </div>

                <!-- Payment Method -->

                <div class="mb-4">
                  <label class="form-label"> Metode Pembayaran </label>

                  <select class="form-select" id="paymentMethod" required>
                    <option value="">-- Pilih Pembayaran --</option>

                    <option value="Tunai">Tunai / Cash</option>

                    <option value="Bank">Transfer Bank</option>

                    <option value="Ewallet">E-Wallet</option>
                  </select>
                </div>

                <div class="mb-4" id="detailPaymentBox" style="display: none">
                  <label class="form-label"> Pilih Detail Pembayaran </label>

                  <select class="form-select" id="detailPayment">
                    <option value="">-- Pilih Detail --</option>
                  </select>
                </div>

                <!-- Total -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <h4>Total Pembayaran</h4>

                  <h4 class="text-warning" id="totalPayment">Rp0</h4>
                </div>

                <!-- Button -->
                <button type="submit" class="btn-payment w-100">Bayar Sekarang</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      // =========================
      // DETAIL PAYMENT
      // =========================

      const detailPaymentBox = document.getElementById("detailPaymentBox");

      const detailPayment = document.getElementById("detailPayment");

      paymentMethod.addEventListener("change", function () {
        const value = this.value;

        // RESET
        detailPayment.innerHTML = `
            <option value="">
              -- Pilih Detail --
            </option>
          `;

        // =====================
        // TUNAI
        // =====================

        if (value === "Tunai") {
          detailPaymentBox.style.display = "none";
        }

        // =====================
        // BANK
        // =====================
        else if (value === "Bank") {
          detailPaymentBox.style.display = "block";

          detailPayment.innerHTML += `
          <option value="BCA">
            Bank BCA
          </option>

          <option value="Mandiri">
            Bank Mandiri
          </option>

          <option value="BRI">
            Bank BRI
          </option>

          <option value="BNI">
            Bank BNI
          </option>

          <option value="BSI">
            Bank BSI
          </option>
        `;
        }

        // =====================
        // E-WALLET
        // =====================
        else if (value === "Ewallet") {
          detailPaymentBox.style.display = "block";

          detailPayment.innerHTML += `
          <option value="Gopay">
            Gopay
          </option>

          <option value="OVO">
            OVO
          </option>

          <option value="DANA">
            DANA
          </option>
        `;
        }
      });
    </script>

    <!-- Success Popup -->
    <div class="success-popup" id="successPopup">
      <div class="popup-content">
        <i class="bi bi-check-circle-fill"></i>

        <h3>Pembayaran Berhasil!</h3>

        <p class="text-light mt-3">Terima kasih telah memesan di SAVERY</p>

        <!-- E-STRUK -->
        <div class="receipt-box mt-4" id="receiptBox">
          <h5 class="text-warning mb-3">E-STRUK PEMBAYARAN</h5>

          <div id="receiptItems"></div>

          <hr />

          <div class="d-flex justify-content-between">
            <strong>Total</strong>
            <strong id="receiptTotal"></strong>
          </div>
        </div>

        <!-- BUTTON -->
        <button class="btn btn-warning mt-4 fw-bold w-100" id="downloadReceipt">Download E-Struk</button>

        <button class="btn btn-outline-light mt-3 w-100" onclick="backToHome()">Kembali ke Home</button>
      </div>
    </div>

    <script>
      // =========================
      // TOTAL PAYMENT
      // =========================

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      let total = 0;

      cart.forEach((item) => {
        total += item.price * item.qty;
      });

      document.getElementById("totalPayment").innerText = "Rp" + total.toLocaleString("id-ID");

      // =========================
      // PAYMENT SUBMIT
      // =========================

      const paymentForm = document.getElementById("paymentForm");

      const successPopup = document.getElementById("successPopup");

      paymentForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const receiptItems = document.getElementById("receiptItems");

        const receiptTotal = document.getElementById("receiptTotal");

        receiptItems.innerHTML = "";

        let total = 0;

        cart.forEach((item) => {
          const subtotal = item.price * item.qty;

          total += subtotal;

          receiptItems.innerHTML += `
      <div class="receipt-item">

        <div>
          <strong>${item.name}</strong>
          <br>
          <small>
            Rp${item.price.toLocaleString("id-ID")}
            x ${item.qty}
          </small>
        </div>

        <div>
          Rp${subtotal.toLocaleString("id-ID")}
        </div>

      </div>
    `;
        });

        receiptTotal.innerText = "Rp" + total.toLocaleString("id-ID");

        successPopup.classList.add("active");

        // Hapus cart
        localStorage.removeItem("cart");
      });

      // =========================
      // BACK HOME
      // =========================

      function backToHome() {
        window.location.href = "index.html";
      }

      // =========================
      // DOWNLOAD RECEIPT
      // =========================

      document.getElementById("downloadReceipt").addEventListener("click", function () {
        let receiptText = `
========================
      SAVERY
   E-STRUK PEMBAYARAN
========================

`;

        let total = 0;

        cart.forEach((item) => {
          const subtotal = item.price * item.qty;

          total += subtotal;

          receiptText += `
${item.name}
Rp${item.price.toLocaleString("id-ID")} x ${item.qty}
= Rp${subtotal.toLocaleString("id-ID")}

`;
        });

        receiptText += `
========================
TOTAL:
Rp${total.toLocaleString("id-ID")}
========================

Terima kasih telah
memesan di SAVERY
`;

        const blob = new Blob([receiptText], { type: "text/plain" });

        const link = document.createElement("a");

        link.href = URL.createObjectURL(blob);

        link.download = "E-Struk-SAVERY.txt";

        link.click();
      });
    </script>
  </body>
</html>
